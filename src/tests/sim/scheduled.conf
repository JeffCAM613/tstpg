# EPF Data Purge simulator - settings of a run without questions
# (--non-interactive): one command, which a scheduler of yours can start.
# The tool schedules nothing itself.
# The values are examples for the simulator only: it connects to nothing.
TNS=EPFPG782
EPF_PASSWORD=example-only
SYS_PASSWORD=example-only
# The days of data kept: older rows are purged. Or CUTOFF=2025-10-13
RETENTION_DAYS=365
# Y enlarges the online redo logs for the purge (put back at its end).
REDO_LOGS=Y
# Y removes the tool's objects from the database after the run.
UNINSTALL_AFTER=N
